<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>🎬 معاً - مشاهدة مشتركة</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1a0033 0%, #330033 50%, #660033 100%);
    color: #fff; min-height: 100vh; padding: 10px;
    overflow-x: hidden;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 {
    text-align: center; font-size: 1.8em; margin: 15px 0;
    background: linear-gradient(90deg, #ff6b9d, #c06c84, #f67280);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 20px; margin: 15px 0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .video-wrap {
    position: relative; width: 100%; padding-top: 56.25%;
    background: #000; border-radius: 15px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(255,107,157,0.3);
  }
  video {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; object-fit: contain;
  }
  .url-input {
    width: 100%; padding: 14px; border-radius: 12px;
    border: 2px solid rgba(255,107,157,0.3);
    background: rgba(0,0,0,0.4); color: #fff;
    font-size: 15px; margin: 8px 0;
  }
  .url-input:focus { outline: none; border-color: #ff6b9d; }
  .btn {
    padding: 12px 20px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #ff6b9d, #c06c84);
    color: #fff; font-size: 15px; font-weight: bold;
    cursor: pointer; margin: 5px; transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(255,107,157,0.4);
  }
  .btn:active { transform: scale(0.95); }
  .btn-secondary { background: linear-gradient(135deg, #4a4e69, #22223b); }
  .btn-success { background: linear-gradient(135deg, #06d6a0, #118ab2); }
  .status {
    text-align: center; padding: 10px; border-radius: 10px;
    margin: 10px 0; font-size: 14px;
    background: rgba(0,0,0,0.3);
  }
  .status.connected { background: rgba(6,214,160,0.2); color: #06d6a0; }
  .status.waiting { background: rgba(255,193,7,0.2); color: #ffc107; }
  .chat-box {
    height: 200px; overflow-y: auto; padding: 10px;
    background: rgba(0,0,0,0.3); border-radius: 12px;
    margin: 10px 0;
  }
  .msg {
    padding: 8px 12px; margin: 5px 0; border-radius: 12px;
    max-width: 80%; word-wrap: break-word;
  }
  .msg.me { background: linear-gradient(135deg, #ff6b9d, #c06c84); margin-right: auto; }
  .msg.her { background: rgba(255,255,255,0.15); margin-left: auto; text-align: left; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-top: 10px; }
  .controls .btn { flex: 1; min-width: 80px; padding: 10px; font-size: 13px; }
  .peer-id {
    background: rgba(0,0,0,0.5); padding: 10px;
    border-radius: 10px; text-align: center;
    font-family: monospace; font-size: 13px;
    word-break: break-all; cursor: pointer;
    border: 1px dashed rgba(255,107,157,0.5);
  }
  label { display: block; margin: 10px 0 5px; color: #f67280; font-size: 14px; }
  .heart { animation: beat 1.5s infinite; display: inline-block; }
  @keyframes beat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }
  .footer { text-align: center; padding: 20px; color: #c06c84; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1><span class="heart">💕</span> معاً <span class="heart">💕</span></h1>

  <!-- الاتصال -->
  <div class="card">
    <h3 style="margin-bottom:10px;">🔗 الاتصال بينكما</h3>
    <div id="status" class="status waiting">⏳ جاري إنشاء الاتصال...</div>
    <label>📱 معرفك (أرسليه لحبيبتك):</label>
    <div id="myId" class="peer-id">جاري التحميل...</div>
    <label>💌 أدخل معرف حبيبتك:</label>
    <input type="text" id="peerId" class="url-input" placeholder="الصق المعرف هنا...">
    <button class="btn btn-success" onclick="connect()">🔗 اتصال</button>
  </div>

  <!-- الفيديو -->
  <div class="card">
    <label>🎬 رابط الفيديو (MP4 / M3U8):</label>
    <input type="text" id="videoUrl" class="url-input" placeholder="https://example.com/movie.mp4">
    <button class="btn" onclick="loadVideo()">▶️ تشغيل</button>
    <div class="video-wrap" style="margin-top:15px;">
      <video id="video" controls playsinline webkit-playsinline></video>
    </div>
    <div class="controls">
      <button class="btn" onclick="sendCmd('play')">▶️ تشغيل</button>
      <button class="btn" onclick="sendCmd('pause')">⏸️ إيقاف</button>
      <button class="btn" onclick="sendCmd('sync')">🔄 مزامنة</button>
    </div>
  </div>

  <!-- الدردشة -->
  <div class="card">
    <h3 style="margin-bottom:10px;">💬 دردشة</h3>
    <div id="chat" class="chat-box"></div>
    <div style="display:flex; gap:5px;">
      <input type="text" id="msg" class="url-input" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter')sendMsg()">
      <button class="btn" onclick="sendMsg()">📤</button>
    </div>
  </div>

  <div class="footer">صُنع بحب 💕 من بغداد إلى الموصل</div>
</div>

<script>
let peer, conn, video = document.getElementById('video');
let myName = Math.random().toString(36).substr(2, 8);

// إنشاء Peer
peer = new Peer('love-' + myName, { debug: 0 });

peer.on('open', id => {
  document.getElementById('myId').textContent = id;
  document.getElementById('myId').onclick = () => {
    navigator.clipboard.writeText(id).then(()=>alert('✅ تم النسخ!'));
  };
  document.getElementById('status').textContent = '✅ جاهز! شارك معرفك مع حبيبتك';
});

peer.on('connection', c => { conn = c; setupConn(); });

function connect() {
  const pid = document.getElementById('peerId').value.trim();
  if (!pid) return alert('أدخل معرف حبيبتك');
  conn = peer.connect(pid, { reliable: true });
  setupConn();
}

function setupConn() {
  conn.on('open', () => {
    document.getElementById('status').textContent = '💕 متصل مع الحبيبة!';
    document.getElementById('status').className = 'status connected';
    addMsg('🎉 تم الاتصال!', 'sys');
  });
  conn.on('data', d => {
    if (d.type === 'msg') addMsg(d.text, 'her');
    else if (d.type === 'play') { video.play(); }
    else if (d.type === 'pause') { video.pause(); }
    else if (d.type === 'seek') { video.currentTime = d.time; }
    else if (d.type === 'sync') {
      if (Math.abs(video.currentTime - d.time) > 2) video.currentTime = d.time;
      if (d.playing && video.paused) video.play();
      if (!d.playing && !video.paused) video.pause();
    }
  });
  conn.on('close', () => {
    document.getElementById('status').textContent = '❌ انقطع الاتصال';
    document.getElementById('status').className = 'status waiting';
  });
}

function loadVideo() {
  const url = document.getElementById('videoUrl').value.trim();
  if (!url) return alert('أدخل رابط الفيديو');
  video.src = url;
  video.load();
}

function sendCmd(cmd) {
  if (!conn || !conn.open) return alert('غير متصل بعد');
  if (cmd === 'play') video.play();
  if (cmd === 'pause') video.pause();
  if (cmd === 'sync') {
    conn.send({ type: 'sync', time: video.currentTime, playing: !video.paused });
  }
}

function sendMsg() {
  const inp = document.getElementById('msg');
  const txt = inp.value.trim();
  if (!txt) return;
  addMsg(txt, 'me');
  if (conn && conn.open) conn.send({ type: 'msg', text: txt });
  inp.value = '';
}

function addMsg(text, who) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// مزامنة تلقائية كل 5 ثواني
setInterval(() => {
  if (conn && conn.open) {
    conn.send({ type: 'sync', time: video.currentTime, playing: !video.paused });
  }
}, 5000);

// مزامنة عند البحث
video.addEventListener('seeked', () => {
  if (conn && conn.open) conn.send({ type: 'seek', time: video.currentTime });
});
</script>
</body>
</html>
