<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار بسيط</title>
<style>
  body { font-family: Arial; background: #1a1a2e; color: #fff; padding: 20px; text-align: center; }
  .btn { padding: 15px 30px; background: #3ECF8E; color: #fff; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; margin: 10px; }
  .log { background: #000; padding: 15px; border-radius: 10px; margin: 20px 0; text-align: right; font-family: monospace; min-height: 200px; color: #0f0; font-size: 14px; }
</style>
</head>
<body>
<h1> اختبار JavaScript</h1>
<p>اضغط الأزرار بالترتيب</p>

<button class="btn" onclick="alert('JavaScript يعمل! ✅')">1️ اضغط هنا أولاً</button>
<br>
<button class="btn" onclick="testSupabase()">2️⃣ اختبار Supabase</button>

<div id="log" class="log">جاهز...</div>

<script>
// التقاط كل الأخطاء
window.onerror = function(msg, url, line) {
  document.getElementById('log').innerHTML += `<div style="color:red">❌ خطأ: ${msg}<br>السطر: ${line}</div>`;
  return true;
};

document.getElementById('log').innerHTML += '<div>✅ JavaScript يعمل</div>';

async function testSupabase() {
  const log = document.getElementById('log');
  log.innerHTML += '<div>🔄 بدء اختبار Supabase...</div>';
  
  try {
    // هل المكتبة موجودة؟
    if (typeof window.supabase === 'undefined') {
      log.innerHTML += '<div style="color:red">❌ مكتبة Supabase غير محمّلة!</div>';
      return;
    }
    log.innerHTML += '<div style="color:#3ECF8E">✅ المكتبة محمّلة</div>';
    
    // إنشاء العميل
    const supabase = window.supabase.createClient(
      'https://hyjdtaebojymujjjcylb.supabase.co',
      'sb_publishable_qpAsyVJDbwhfMyzuLBS06g_hqGz2ilN'
    );
    log.innerHTML += '<div style="color:#3ECF8E">✅ تم إنشاء العميل</div>';
    
    // اختبار الاتصال
    log.innerHTML += '<div>🔄 جاري الاتصال...</div>';
    const { data, error } = await supabase.from('messages').select('id').limit(1);
    
    if (error) {
      log.innerHTML += `<div style="color:red">❌ خطأ: ${error.message}</div>`;
      log.innerHTML += `<div style="color:orange">الكود: ${error.code}</div>`;
    } else {
      log.innerHTML += '<div style="color:#3ECF8E">✅ الاتصال ناجح!</div>';
    }
  } catch (e) {
    log.innerHTML += `<div style="color:red">❌ استثناء: ${e.message}</div>`;
  }
}
</script>
</body>
</html>
