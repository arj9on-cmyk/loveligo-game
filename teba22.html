<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎬 غرفة المشاهدة</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #2d1b69 100%);
    color: #fff; min-height: 100vh; overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.1) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .app { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: 10px; }

  /* شاشة تسجيل الدخول */
  .login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px;
  }
  .login-logo {
    text-align: center;
    font-size: 60px;
    margin-bottom: 10px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .login-title {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 30px;
    background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .login-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    padding: 25px;
    margin-bottom: 15px;
  }
  .login-card h3 {
    margin-bottom: 15px;
    color: #667eea;
    font-size: 18px;
  }
  .input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 15px;
    border: 2px solid rgba(102,126,234,0.3);
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-size: 15px;
    margin-bottom: 12px;
    transition: all 0.3s;
  }
  .input:focus {
    outline: none;
    border-color: #667eea;
    background: rgba(0,0,0,0.6);
  }
  .input::placeholder { color: rgba(255,255,255,0.4); }
  
  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    box-shadow: 0 8px 25px rgba(102,126,234,0.4);
  }
  .btn-success {
    background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    color: #fff;
    box-shadow: 0 8px 25px rgba(56,239,125,0.4);
  }
  .btn-danger {
    background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
    color: #fff;
  }
  .btn-warning {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: #fff;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    background: rgba(255,255,255,0.05);
    border: 2px solid transparent;
    transition: all 0.3s;
    font-weight: bold;
  }
  .tab.active {
    background: rgba(102,126,234,0.2);
    border-color: #667eea;
    color: #667eea;
  }

  /* شاشة الغرفة */
  .room-screen { display: none; }
  .room-screen.active { display: block; }

  .room-header {
    background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2));
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 15px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .room-avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
    border: 3px solid rgba(255,255,255,0.2);
    overflow: hidden;
  }
  .room-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .room-info { flex: 1; min-width: 0; }
  .room-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .room-meta {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .room-id-badge {
    background: rgba(102,126,234,0.3);
    padding: 3px 10px;
    border-radius: 10px;
    font-family: monospace;
    font-size: 11px;
    cursor: pointer;
  }
  .room-members {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #FFD700;
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn.danger { background: rgba(235,51,73,0.3); }

  /* المقاعد الصوتية */
  .seats-section {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 15px;
    margin-bottom: 15px;
  }
  .seats-title {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 12px;
    text-align: center;
  }
  .seats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .seat {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.05);
    border: 2px dashed rgba(255,255,255,0.2);
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    padding: 5px;
  }
  .seat.occupied {
    background: linear-gradient(135deg, rgba(102,126,234,0.3), rgba(118,75,162,0.3));
    border: 2px solid rgba(102,126,234,0.5);
  }
  .seat.owner {
    background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,165,0,0.3));
    border: 2px solid #FFD700;
  }
  .seat.speaking {
    animation: speakPulse 1s infinite;
    border-color: #38ef7d;
  }
  @keyframes speakPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(56,239,125,0.7); }
    50% { box-shadow: 0 0 0 10px rgba(56,239,125,0); }
  }
  .seat:active { transform: scale(0.95); }
  .seat-icon {
    font-size: 28px;
    margin-bottom: 4px;
  }
  .seat-name {
    font-size: 9px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    font-weight: bold;
  }
  .seat-badge {
    position: absolute;
    top: 3px;
    right: 3px;
    font-size: 10px;
  }

  /* الفيديو */
  .video-section {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 15px;
    margin-bottom: 15px;
  }
  .video-url-input {
    width: 100%;
    padding: 12px 15px;
    border-radius: 12px;
    border: 2px solid rgba(102,126,234,0.3);
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .video-url-input:focus {
    outline: none;
    border-color: #667eea;
  }
  .video-container {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
    border-radius: 15px;
    overflow: hidden;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .video-container video, .video-container iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
  .video-placeholder {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.4);
    font-size: 14px;
  }
  .video-placeholder-icon {
    font-size: 50px;
    margin-bottom: 10px;
  }
  .video-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .video-controls .btn {
    margin: 0;
    padding: 12px;
    font-size: 14px;
  }

  /* الدردشة */
  .chat-section {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 15px;
    margin-bottom: 15px;
  }
  .chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .chat-title {
    font-size: 16px;
    font-weight: bold;
  }
  .chat-box {
    height: 250px;
    overflow-y: auto;
    padding: 10px;
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
    margin-bottom: 12px;
  }
  .chat-box::-webkit-scrollbar { width: 4px; }
  .chat-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
  .msg {
    padding: 10px 14px;
    margin: 6px 0;
    border-radius: 15px;
    max-width: 85%;
    word-wrap: break-word;
    font-size: 14px;
    animation: slideIn 0.3s;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.me {
    background: linear-gradient(135deg, #667eea, #764ba2);
    margin-right: auto;
    border-bottom-right-radius: 4px;
  }
  .msg.other {
    background: rgba(255,255,255,0.1);
    margin-left: auto;
    border-bottom-left-radius: 4px;
  }
  .msg.sys {
    background: rgba(56,239,125,0.15);
    color: #38ef7d;
    text-align: center;
    margin: 10px auto;
    max-width: 90%;
    font-size: 12px;
  }
  .msg.kick {
    background: rgba(235,51,73,0.2);
    color: #eb3349;
    text-align: center;
    margin: 10px auto;
  }
  .msg-author {
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 3px;
    font-weight: bold;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .chat-input {
    flex: 1;
    padding: 12px 15px;
    border-radius: 25px;
    border: 2px solid rgba(102,126,234,0.3);
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-size: 14px;
  }
  .chat-input:focus { outline: none; border-color: #667eea; }
  .send-btn {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mic-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }
  .mic-controls .btn {
    flex: 1;
    margin: 0;
    padding: 14px;
  }

  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: linear-gradient(135deg, #1a1f4e, #2d1b69);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 25px;
    max-width: 400px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
    text-align: center;
  }
  .modal-close {
    float: left;
    background: none;
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
  }

  .hidden { display: none !important; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.9);
    color: #fff;
    padding: 12px 20px;
    border-radius: 25px;
    font-size: 14px;
    z-index: 2000;
    animation: toastIn 0.3s;
    border: 1px solid rgba(255,255,255,0.2);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>
</head>
<body>

<div class="app">

  <!-- شاشة تسجيل الدخول -->
  <div id="loginScreen" class="login-screen">
    <div class="login-logo">🎬</div>
    <div class="login-title">غرفة المشاهدة</div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('join')">🚪 انضمام</div>
      <div class="tab" onclick="switchTab('create')">✨ إنشاء غرفة</div>
    </div>

    <!-- تبويب الانضمام -->
    <div id="joinTab" class="login-card">
      <h3>🚪 الانضمام لغرفة موجودة</h3>
      <input type="text" id="joinRoomId" class="input" placeholder="🆔 أدخل ID الغرفة">
      <input type="text" id="joinUserName" class="input" placeholder="👤 اسمك">
      <button class="btn btn-success" onclick="joinExistingRoom()">🎉 دخول الغرفة</button>
    </div>

    <!-- تبويب الإنشاء -->
    <div id="createTab" class="login-card hidden">
      <h3>✨ إنشاء غرفة جديدة</h3>
      <input type="text" id="createRoomName" class="input" placeholder="📝 اسم الغرفة">
      <input type="text" id="createUserName" class="input" placeholder="👤 اسمك (المالك)">
      <input type="text" id="createRoomImage" class="input" placeholder="🖼️ رابط صورة الغرفة (اختياري)">
      <button class="btn btn-primary" onclick="createRoom()">🚀 إنشاء الغرفة</button>
    </div>

    <div id="loginStatus" style="text-align:center; margin-top:15px; color:#ff6b6b;"></div>
  </div>

  <!-- شاشة الغرفة -->
  <div id="roomScreen" class="room-screen">
    
    <!-- الهيدر -->
    <div class="room-header">
      <div class="room-avatar" id="roomAvatar">🎬</div>
      <div class="room-info">
        <div class="room-name" id="roomNameDisplay">غرفتي</div>
        <div class="room-meta">
          <span class="room-id-badge" id="roomIdDisplay" onclick="copyRoomId()"> ---</span>
          <span class="room-members" id="roomMembers">👥 0/5</span>
          <span id="ownerBadge" class="hidden" style="color:#FFD700;">👑</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="showSettings()">⚙️</button>
        <button class="icon-btn danger" onclick="leaveRoom()"></button>
      </div>
    </div>

    <!-- المقاعد الصوتية -->
    <div class="seats-section">
      <div class="seats-title">🎙️ المقاعد الصوتية (انقر للصعود)</div>
      <div class="seats-grid" id="seatsGrid"></div>
    </div>

    <!-- التحكم بالمايك -->
    <div class="mic-controls">
      <button class="btn btn-secondary" id="micBtn" onclick="toggleMic()"> تفعيل المايك</button>
      <button class="btn btn-secondary" id="speakerBtn" onclick="toggleSpeaker()">🔊 السماعة</button>
    </div>

    <!-- منطقة الفيديو -->
    <div class="video-section">
      <input type="text" id="videoUrl" class="video-url-input" placeholder="📺 أدخل رابط الفيديو هنا... (YouTube / MP4 / M3U8)">
      <div class="video-container" id="videoContainer">
        <div class="video-placeholder">
          <div class="video-placeholder-icon">🎬</div>
          <div>لم يتم تحميل فيديو بعد</div>
        </div>
      </div>
      <div class="video-controls">
        <button class="btn btn-success" id="loadBtn" onclick="loadVideo()">📥 تحميل</button>
        <button class="btn btn-primary" id="playBtn" onclick="sendPlay()">▶️ تشغيل للجميع</button>
        <button class="btn btn-warning" id="pauseBtn" onclick="sendPause()">⏸️ إيقاف مزامنة</button>
        <button class="btn btn-secondary" onclick="syncVideo()">🔄 مزامنة</button>
      </div>
    </div>

    <!-- الدردشة -->
    <div class="chat-section">
      <div class="chat-header">
        <div class="chat-title">💬 الدردشة</div>
        <div style="font-size:12px; color:rgba(255,255,255,0.5);" id="chatCount">0 رسائل</div>
      </div>
      <div class="chat-box" id="chatBox"></div>
      <div class="chat-input-row">
        <input type="text" id="chatMsg" class="chat-input" placeholder="✏️ اكتب رسالتك..." onkeypress="if(event.key==='Enter')sendChat()">
        <button class="send-btn" onclick="sendChat()">📤</button>
      </div>
    </div>

  </div>
</div>

<!-- Modal الإعدادات -->
<div id="settingsModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeSettings()">✕</button>
    <div class="modal-title">⚙️ إعدادات الغرفة</div>
    <div id="settingsContent"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://hyjdtaebojymujjjcylb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qpAsyVJDbwhfMyzuLBS06g_hqGz2ilN';
const MAX_SEATS = 5;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentRoom = null;
let currentRoomData = null;
let currentUserId = null;
let currentUserName = '';
let isOwner = false;
let lastMessageId = 0;
let channel = null;
let localStream = null;
let peerConnections = {};
let isMicOn = false;
let isSpeakerOn = true;
let videoElement = null;
let hlsPlayer = null;
let myJoinMessageId = null;
let ownerUserId = null;
let usersInRoom = new Map();
let remoteAudios = new Map();
let seatAssignments = new Map();
let chatMessageCount = 0;

function showToast(msg, duration = 3000) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), duration);
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (tab === 'join') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('joinTab').classList.remove('hidden');
    document.getElementById('createTab').classList.add('hidden');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('createTab').classList.remove('hidden');
    document.getElementById('joinTab').classList.add('hidden');
  }
}

async function createRoom() {
  const roomName = document.getElementById('createRoomName').value.trim();
  const userName = document.getElementById('createUserName').value.trim();
  const roomImage = document.getElementById('createRoomImage').value.trim();
  
  if (!roomName || !userName) {
    showToast('️ أدخل اسم الغرفة واسمك');
    return;
  }
  
  try {
    document.getElementById('loginStatus').textContent = '🔄 جاري إنشاء الغرفة...';
    
    const roomId = 'ROOM_' + Math.random().toString(36).substr(2, 6).toUpperCase();
    currentUserId = 'user_' + Math.random().toString(36).substr(2, 9);
    currentUserName = userName;
    currentRoom = roomId;
    isOwner = true;
    ownerUserId = currentUserId;
    
    currentRoomData = {
      room_id: roomId,
      name: roomName,
      image: roomImage || '',
      owner: currentUserId,
      owner_name: userName
    };
    
    const { error: roomError } = await sb
      .from('rooms')
      .insert([{
        room_id: roomId,
        name: roomName,
        image: roomImage,
        owner: currentUserId,
        owner_name: userName
      }]);
    
    if (roomError) {
      console.log('⚠️ خطأ في حفظ الغرفة: ' + roomError.message);
    }
    
    await enterRoom();
    
  } catch (error) {
    document.getElementById('loginStatus').textContent = '❌ ' + error.message;
  }
}

async function joinExistingRoom() {
  const roomId = document.getElementById('joinRoomId').value.trim().toUpperCase();
  const userName = document.getElementById('joinUserName').value.trim();
  
  if (!roomId || !userName) {
    showToast('⚠️ أدخل ID الغرفة واسمك');
    return;
  }
  
  try {
    document.getElementById('loginStatus').textContent = '🔄 جاري الانضمام...';
    
    currentUserId = 'user_' + Math.random().toString(36).substr(2, 9);
    currentUserName = userName;
    currentRoom = roomId;
    
    const { data: roomData, error: roomError } = await sb
      .from('rooms')
      .select('*')
      .eq('room_id', roomId)
      .single();
    
    if (roomError || !roomData) {
      currentRoomData = {
        room_id: roomId,
        name: 'غرفة ' + roomId,
        image: '',
        owner: null,
        owner_name: 'مجهول'
      };
    } else {
      currentRoomData = roomData;
    }
    
    isOwner = (currentRoomData.owner === currentUserId) || !currentRoomData.owner;
    ownerUserId = currentRoomData.owner || currentUserId;
    
    await enterRoom();
    
  } catch (error) {
    document.getElementById('loginStatus').textContent = '❌ ' + error.message;
  }
}

async function enterRoom() {
  try {
    channel = sb.channel('room-' + currentRoom, {
      config: {
        broadcast: { self: true },
        presence: { key: currentUserId }
      }
    });
    
    channel.on('postgres_changes', 
      { event: 'INSERT', schema: 'public', table: 'messages' },
      payload => {
        const msg = payload.new;
        if (msg.room !== currentRoom) return;
        if (msg.id <= lastMessageId) return;
        lastMessageId = msg.id;
        handleMessage(msg);
      }
    );
    
    await new Promise((resolve, reject) => {
      channel.subscribe((status) => {
        if (status === 'SUBSCRIBED') resolve();
        else if (status === 'CHANNEL_ERROR') reject(new Error('فشل الاشتراك'));
      });
    });
    
    const { data: allJoins } = await sb
      .from('messages')
      .select('id, user_name, content, created_at')
      .eq('room', currentRoom)
      .eq('type', 'join')
      .order('created_at', { ascending: true });
    
    if (allJoins && allJoins.length > 0) {
      ownerUserId = allJoins[0].content;
      if (allJoins[0].user_name === currentUserName) {
        isOwner = true;
        ownerUserId = currentUserId;
      } else {
        isOwner = false;
      }
    } else {
      isOwner = true;
      ownerUserId = currentUserId;
    }
    
    const { data: insertData, error: insertError } = await sb
      .from('messages')
      .insert([{
        room: currentRoom,
        type: 'join',
        user_name: currentUserName,
        content: currentUserId
      }])
      .select('id')
      .single();
    
    if (insertError) {
      showToast(' ' + insertError.message);
      return;
    }
    
    if (insertData) {
      myJoinMessageId = insertData.id;
      lastMessageId = Math.max(lastMessageId, insertData.id);
    }
    
    await initWebRTC();
    
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('roomScreen').classList.add('active');
    
    updateRoomUI();
    renderSeats();
    
    addChatMsg('🎉 دخلت الغرفة! شارك ID: ' + currentRoom, 'sys');
    if (isOwner) {
      addChatMsg('👑 أنت مالك الغرفة!', 'sys');
    }
    
  } catch (error) {
    showToast(' ' + error.message);
  }
}

function updateRoomUI() {
  const avatar = document.getElementById('roomAvatar');
  if (currentRoomData && currentRoomData.image) {
    avatar.innerHTML = `<img src="${currentRoomData.image}" onerror="this.parentElement.innerHTML='🎬'">`;
  } else {
    avatar.innerHTML = '🎬';
  }
  
  document.getElementById('roomNameDisplay').textContent = currentRoomData?.name || 'غرفة';
  document.getElementById('roomIdDisplay').textContent = '🆔 ' + currentRoom;
  
  if (isOwner) {
    document.getElementById('ownerBadge').classList.remove('hidden');
  } else {
    document.getElementById('ownerBadge').classList.add('hidden');
  }
  
  const ownerOnlyElements = ['loadBtn', 'playBtn', 'pauseBtn'];
  ownerOnlyElements.forEach(id => {
    const el = document.getElementById(id);
    if (el && !isOwner) {
      el.style.opacity = '0.5';
      el.onclick = () => showToast('⚠️ فقط المالك يمكنه القيام بهذا');
    }
  });
  
  updateMemberCount();
}

function updateMemberCount() {
  const count = usersInRoom.size + (usersInRoom.has(currentUserId) ? 0 : 1);
  document.getElementById('roomMembers').textContent = `👥 ${count}/${MAX_SEATS}`;
}

function renderSeats() {
  const grid = document.getElementById('seatsGrid');
  grid.innerHTML = '';
  
  for (let i = 0; i < MAX_SEATS; i++) {
    const seat = document.createElement('div');
    seat.className = 'seat';
    seat.dataset.index = i;
    
    let user = null;
    let userId = null;
    seatAssignments.forEach((seatIdx, uid) => {
      if (seatIdx === i) {
        userId = uid;
        user = usersInRoom.get(uid) || { name: 'مجهول' };
      }
    });
    
    if (user && userId) {
      seat.classList.add('occupied');
      if (userId === ownerUserId) seat.classList.add('owner');
      
      const micIcon = isMicOn && userId === currentUserId ? '🎤' : '';
      const badge = userId === ownerUserId ? '👑' : '';
      
      seat.innerHTML = `
        <div class="seat-badge">${badge}</div>
        <div class="seat-icon">${micIcon}</div>
        <div class="seat-name">${user.name}${userId === currentUserId ? ' (أنت)' : ''}</div>
      `;
      
      if (isOwner && userId !== currentUserId) {
        const kickBtn = document.createElement('button');
        kickBtn.style.cssText = 'position:absolute;bottom:2px;right:2px;background:#eb3349;border:none;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;color:#fff;';
        kickBtn.textContent = '';
        kickBtn.onclick = (e) => { e.stopPropagation(); kickUser(user.name); };
        seat.appendChild(kickBtn);
      }
    } else {
      seat.innerHTML = `
        <div class="seat-icon" style="opacity:0.3;">➕</div>
        <div class="seat-name" style="opacity:0.5;">فارغ</div>
      `;
      seat.onclick = () => takeSeat(i);
    }
    
    grid.appendChild(seat);
  }
}

function takeSeat(seatIndex) {
  if (usersInRoom.size >= MAX_SEATS - 1) {
    showToast('⚠️ الغرفة ممتلئة (5/5)');
    return;
  }
  seatAssignments.set(currentUserId, seatIndex);
  renderSeats();
  showToast('✅ جلست في المقعد ' + (seatIndex + 1));
}

async function initWebRTC() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    localStream.getAudioTracks().forEach(t => t.enabled = false);
  } catch (error) {
    console.log('⚠️ خطأ المايك: ' + error.message);
  }
}

async function toggleMic() {
  if (!localStream) {
    showToast('⚠️ المايك غير متاح');
    return;
  }
  
  isMicOn = !isMicOn;
  localStream.getAudioTracks().forEach(t => t.enabled = isMicOn);
  
  const btn = document.getElementById('micBtn');
  btn.textContent = isMicOn ? '🎤 المايك مفعل' : '🔇 المايك مغلق';
  btn.className = isMicOn ? 'btn btn-danger' : 'btn btn-secondary';
  
  if (isMicOn) {
    usersInRoom.forEach((user, userId) => {
      if (userId !== currentUserId) connectToPeer(userId);
    });
  } else {
    Object.values(peerConnections).forEach(pc => pc.close());
    peerConnections = {};
  }
  
  renderSeats();
}

function toggleSpeaker() {
  isSpeakerOn = !isSpeakerOn;
  remoteAudios.forEach(audio => { audio.muted = !isSpeakerOn; });
  const btn = document.getElementById('speakerBtn');
  btn.textContent = isSpeakerOn ? ' السماعة مفعلة' : ' السماعة مكتومة';
  showToast(isSpeakerOn ? '🔊 السماعة مفعلة' : '🔇 السماعة مكتومة');
}

function connectToPeer(remoteUserId) {
  if (peerConnections[remoteUserId]) return;
  
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  });
  
  if (localStream) {
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }
  
  pc.ontrack = event => {
    let audio = remoteAudios.get(remoteUserId);
    if (!audio) {
      audio = new Audio();
      audio.autoplay = true;
      audio.muted = !isSpeakerOn;
      document.body.appendChild(audio);
      remoteAudios.set(remoteUserId, audio);
    }
    audio.srcObject = event.streams[0];
  };
  
  pc.onicecandidate = event => {
    if (event.candidate) {
      sendSignal(remoteUserId, 'candidate', { candidate: event.candidate });
    }
  };
  
  peerConnections[remoteUserId] = pc;
  
  pc.createOffer().then(offer => {
    pc.setLocalDescription(offer);
    sendSignal(remoteUserId, 'offer', { sdp: offer });
  }).catch(err => console.log('❌ خطأ offer: ' + err.message));
}

function sendSignal(toUserId, type, data) {
  const signal = { type, from: currentUserId, to: toUserId, ...data };
  sb.from('messages').insert([{
    room: currentRoom, type: 'signal', user_name: currentUserName,
    content: JSON.stringify(signal)
  }]);
}

function handleSignal(msg) {
  try {
    const signal = JSON.parse(msg.content);
    if (signal.to !== currentUserId) return;
    
    if (signal.type === 'offer') handleOffer(signal);
    else if (signal.type === 'answer') handleAnswer(signal);
    else if (signal.type === 'candidate') handleCandidate(signal);
  } catch (e) {}
}

async function handleOffer(signal) {
  if (peerConnections[signal.from]) return;
  
  const pc = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  });
  
  if (localStream) {
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }
  
  pc.ontrack = event => {
    let audio = remoteAudios.get(signal.from);
    if (!audio) {
      audio = new Audio();
      audio.autoplay = true;
      audio.muted = !isSpeakerOn;
      document.body.appendChild(audio);
      remoteAudios.set(signal.from, audio);
    }
    audio.srcObject = event.streams[0];
  };
  
  pc.onicecandidate = event => {
    if (event.candidate) sendSignal(signal.from, 'candidate', { candidate: event.candidate });
  };
  
  peerConnections[signal.from] = pc;
  
  try {
    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal(signal.from, 'answer', { sdp: answer });
  } catch (e) { console.log('❌ handleOffer: ' + e.message); }
}

async function handleAnswer(signal) {
  const pc = peerConnections[signal.from];
  if (pc) {
    try { await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp)); }
    catch (e) { console.log('❌ handleAnswer: ' + e.message); }
  }
}

async function handleCandidate(signal) {
  const pc = peerConnections[signal.from];
  if (pc) {
    try { await pc.addIceCandidate(new RTCIceCandidate(signal.candidate)); }
    catch (e) { console.log('❌ candidate: ' + e.message); }
  }
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'join': handleJoin(msg); break;
    case 'leave': handleLeave(msg); break;
    case 'chat': addChatMsg(msg.content, 'other', msg.user_name); break;
    case 'play': playVideo(); addChatMsg('▶️ ' + msg.user_name + ' شغّل الفيديو', 'sys'); break;
    case 'pause': pauseVideo(); addChatMsg('⏸️ ' + msg.user_name + ' أوقف الفيديو', 'sys'); break;
    case 'load':
      loadVideoFromUrl(msg.content);
      addChatMsg('📺 ' + msg.user_name + ' حمّل فيديو', 'sys');
      break;
    case 'sync': syncToTime(parseFloat(msg.content)); break;
    case 'kick': handleKick(msg); break;
    case 'signal': handleSignal(msg); break;
  }
}

function handleJoin(msg) {
  const userId = msg.content;
  if (!usersInRoom.has(userId)) {
    usersInRoom.set(userId, { name: msg.user_name, mic: false });
  }
  updateMemberCount();
  renderSeats();
  
  if (userId !== currentUserId) {
    addChatMsg(' ' + msg.user_name + ' انضم للغرفة', 'sys');
    if (isMicOn || isOwner) connectToPeer(userId);
  }
}

function handleLeave(msg) {
  const userId = msg.content;
  usersInRoom.delete(userId);
  seatAssignments.delete(userId);
  if (peerConnections[userId]) {
    peerConnections[userId].close();
    delete peerConnections[userId];
  }
  if (remoteAudios.has(userId)) {
    remoteAudios.get(userId).remove();
    remoteAudios.delete(userId);
  }
  updateMemberCount();
  renderSeats();
  addChatMsg('👋 ' + msg.user_name + ' غادر الغرفة', 'sys');
}

function handleKick(msg) {
  const targetName = msg.content;
  if (targetName === currentUserName) {
    addChatMsg('🚫 تم طردك من الغرفة!', 'kick');
    setTimeout(() => {
      alert('🚫 تم طردك!');
      leaveRoom();
    }, 1000);
  } else {
    addChatMsg('🚫 ' + msg.user_name + ' طرد ' + targetName, 'sys');
  }
}

function loadVideo() {
  if (!isOwner) { showToast('⚠️ فقط المالك'); return; }
  const url = document.getElementById('videoUrl').value.trim();
  if (!url) { showToast('⚠️ أدخل رابط الفيديو'); return; }
  loadVideoFromUrl(url);
  sb.from('messages').insert([{
    room: currentRoom, type: 'load', user_name: currentUserName, content: url
  }]);
}

function loadVideoFromUrl(url) {
  const container = document.getElementById('videoContainer');
  container.innerHTML = '';
  if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
  videoElement = null;
  
  if (url.includes('youtube.com') || url.includes('youtu.be')) {
    const videoId = extractYouTubeId(url);
    if (videoId) {
      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=1`;
      iframe.allow = 'autoplay; encrypted-media';
      iframe.allowFullscreen = true;
      iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:none;';
      container.appendChild(iframe);
    }
  } else if (url.includes('.m3u8')) {
    videoElement = document.createElement('video');
    videoElement.controls = true;
    videoElement.autoplay = true;
    videoElement.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
    container.appendChild(videoElement);
    if (Hls.isSupported()) {
      hlsPlayer = new Hls();
      hlsPlayer.loadSource(url);
      hlsPlayer.attachMedia(videoElement);
    } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
      videoElement.src = url;
    }
  } else {
    videoElement = document.createElement('video');
    videoElement.controls = true;
    videoElement.autoplay = true;
    videoElement.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
    videoElement.src = url;
    container.appendChild(videoElement);
  }
}

function extractYouTubeId(url) {
  const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
  const match = url.match(regExp);
  return (match && match[2].length === 11) ? match[2] : null;
}

function sendPlay() {
  if (!isOwner) { showToast('⚠️ فقط المالك'); return; }
  playVideo();
  sb.from('messages').insert([{ room: currentRoom, type: 'play', user_name: currentUserName, content: 'play' }]);
}

function sendPause() {
  if (!isOwner) { showToast('⚠️ فقط المالك'); return; }
  pauseVideo();
  sb.from('messages').insert([{ room: currentRoom, type: 'pause', user_name: currentUserName, content: 'pause' }]);
}

function syncVideo() {
  if (!videoElement) { showToast('⚠️ لا يوجد فيديو'); return; }
  sb.from('messages').insert([{ room: currentRoom, type: 'sync', user_name: currentUserName, content: videoElement.currentTime.toString() }]);
}

function playVideo() { if (videoElement) videoElement.play().catch(e => {}); }
function pauseVideo() { if (videoElement) videoElement.pause(); }
function syncToTime(time) {
  if (videoElement && Math.abs(videoElement.currentTime - time) > 2) {
    videoElement.currentTime = time;
  }
}

function sendChat() {
  const input = document.getElementById('chatMsg');
  const text = input.value.trim();
  if (!text) return;
  
  sb.from('messages').insert([{
    room: currentRoom, type: 'chat', user_name: currentUserName, content: text
  }]).then(({ data, error }) => {
    if (error) console.log('❌ ' + error.message);
    else if (data && data[0]) lastMessageId = Math.max(lastMessageId, data[0].id);
  });
  
  addChatMsg(text, 'me');
  input.value = '';
}

function addChatMsg(text, type, userName = '') {
  const chatBox = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (type === 'other' && userName) {
    div.innerHTML = `<div class="msg-author">${userName}</div>${text}`;
  } else {
    div.textContent = text;
  }
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  chatMessageCount++;
  document.getElementById('chatCount').textContent = chatMessageCount + ' رسائل';
}

function kickUser(userName) {
  if (!isOwner) { showToast('⚠️ فقط المالك'); return; }
  if (userName === currentUserName) { showToast('⚠️ لا يمكنك طرد نفسك'); return; }
  if (confirm('🚫 طرد ' + userName + '؟')) {
    sb.from('messages').insert([{ room: currentRoom, type: 'kick', user_name: currentUserName, content: userName }]);
    addChatMsg('🚫 تم طرد ' + userName, 'sys');
  }
}

function copyRoomId() {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(currentRoom).then(() => showToast('✅ تم نسخ ID: ' + currentRoom));
  } else {
    prompt('انسخ ID الغرفة:', currentRoom);
  }
}

function showSettings() {
  const content = document.getElementById('settingsContent');
  content.innerHTML = `
    <div style="margin-bottom:15px;">
      <strong>🆔 ID الغرفة:</strong>
      <div style="background:rgba(0,0,0,0.3);padding:10px;border-radius:10px;margin-top:5px;font-family:monospace;word-break:break-all;">
        ${currentRoom}
      </div>
      <button class="btn btn-secondary" onclick="copyRoomId()" style="margin-top:10px;">📋 نسخ ID</button>
    </div>
    <div style="margin-bottom:15px;">
      <strong>👤 اسمك:</strong> ${currentUserName}
    </div>
    <div style="margin-bottom:15px;">
      <strong>👑 المالك:</strong> ${isOwner ? 'أنت' : currentRoomData?.owner_name || 'مجهول'}
    </div>
    <div style="margin-bottom:15px;">
      <strong>👥 الأعضاء:</strong> ${usersInRoom.size + 1} / ${MAX_SEATS}
    </div>
    <button class="btn btn-danger" onclick="closeSettings();leaveRoom();">🚪 مغادرة الغرفة</button>
  `;
  document.getElementById('settingsModal').classList.add('active');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('active');
}

async function leaveRoom() {
  if (isOwner && ownerUserId === currentUserId) {
    const { data: myJoins } = await sb.from('messages').select('id')
      .eq('room', currentRoom).eq('type', 'join').eq('content', currentUserId);
    if (myJoins) {
      for (const join of myJoins) {
        await sb.from('messages').delete().eq('id', join.id);
      }
    }
  } else if (myJoinMessageId) {
    await sb.from('messages').delete().eq('id', myJoinMessageId);
  }
  
  if (currentRoom && currentUserName) {
    await sb.from('messages').insert([{
      room: currentRoom, type: 'leave', user_name: currentUserName, content: currentUserId
    }]);
  }
  
  if (channel) sb.removeChannel(channel);
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  Object.values(peerConnections).forEach(pc => pc.close());
  remoteAudios.forEach(audio => audio.remove());
  
  location.reload();
}

window.addEventListener('beforeunload', () => {
  if (currentRoom && currentUserName) {
    if (isOwner && ownerUserId === currentUserId) {
      sb.from('messages').delete().eq('room', currentRoom).eq('type', 'join').eq('content', currentUserId);
    } else if (myJoinMessageId) {
      sb.from('messages').delete().eq('id', myJoinMessageId);
    }
    sb.from('messages').insert([{ room: currentRoom, type: 'leave', user_name: currentUserName, content: currentUserId }]);
  }
});
</script>
