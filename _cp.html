<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red1 | لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- شاشة الدخول -->
    <div id="login-screen" class="login-box">
        <h2><i class="fas fa-lock"></i> لوحة التحكم</h2>
        <div class="form-group">
            <input type="password" id="admin-pass" placeholder="أدخل كلمة المرور">
        </div>
        <button class="btn-save" onclick="checkPass()">دخول</button>
        <p id="login-error" class="error-msg">كلمة المرور غير صحيحة</p>
    </div>

    <!-- لوحة التحكم -->
    <div id="admin-panel" class="admin-container hidden">
        <h1 class="admin-title">إدارة الملفات</h1>
        
        <form id="add-form">
            <div class="form-group">
                <label>اسم الملف</label>
                <input type="text" id="file-name" required placeholder="مثال: Red1 Premium App">
            </div>
            <div class="form-group">
                <label>الرابط (Google Drive أو غيره)</label>
                <input type="url" id="file-url" required placeholder="https://...">
            </div>
            <div class="form-group">
                <label>الوصف</label>
                <textarea id="file-desc" rows="3" required placeholder="وصف قصير للملف..."></textarea>
            </div>
            <div class="form-group">
                <label>نوع الملف</label>
                <select id="file-type">
                    <option value="apk">تطبيق (APK)</option>
                    <option value="zip">ملف مضغوط (ZIP)</option>
                    <option value="sh">سكربت (SH)</option>
                </select>
            </div>
            <button type="submit" class="btn-save"><i class="fas fa-plus"></i> إضافة الملف</button>
        </form>

        <div class="admin-list">
            <h3 style="margin-bottom: 15px; color: #a0a0a0;">الملفات الحالية</h3>
            <div id="files-list"></div>
        </div>
    </div>

    <script>
        // ⚠️ الإعدادات
        const ADMIN_PASSWORD = "red1_admin_2026"; // ✅ غير كلمة المرور من هنا
        const BIN_ID = "6accf410ac6210605a2adcf9";
        const API_KEY = "$2a$10$6ueSPs.Rth52Seli997/TOuqpEjszXEf1Du6g.bTwyWQhYC/afy/u";
        const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let siteFiles = [];

        function checkPass() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadFiles();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        async function loadFiles() {
            try {
                const res = await fetch(`${BIN_URL}/latest`, {
                    headers: { "X-Master-Key": API_KEY }
                });
                const data = await res.json();
                siteFiles = data.record.site_files || [];
                renderAdminList();
            } catch (e) {
                alert("خطأ في تحميل الملفات");
            }
        }

        function renderAdminList() {
            const list = document.getElementById('files-list');
            if (siteFiles.length === 0) {
                list.innerHTML = "<p style='color: #666;'>لا توجد ملفات.</p>";
                return;
            }
            list.innerHTML = siteFiles.map((f, index) => `
                <div class="admin-item">
                    <div class="admin-item-info">
                        <span class="admin-item-title">${f.name}</span>
                        <span class="admin-item-type">${f.type.toUpperCase()}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteFile(${index})"><i class="fas fa-trash"></i> حذف</button>
                </div>
            `).join('');
        }

        // إضافة ملف
        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newFile = {
                name: document.getElementById('file-name').value,
                url: document.getElementById('file-url').value,
                desc: document.getElementById('file-desc').value,
                type: document.getElementById('file-type').value
            };
            
            siteFiles.push(newFile);
            await saveToBin();
            document.getElementById('add-form').reset();
        });

        // حذف ملف
        async function deleteFile(index) {
            if (!confirm("هل أنت متأكد من الحذف؟")) return;
            siteFiles.splice(index, 1);
            await saveToBin();
        }

        // حفظ في JSONBin
        async function saveToBin() {
            try {
                // نرسل البيانات مع بقية بيانات التطبيق (keys)
                const getRes = await fetch(`${BIN_URL}/latest`, {
                    headers: { "X-Master-Key": API_KEY }
                });
                const currentData = await getRes.json();
                
                const updatedData = {
                    ...currentData.record,
                    site_files: siteFiles
                };

                const putRes = await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY
                    },
                    body: JSON.stringify(updatedData)
                });

                if (putRes.ok) {
                    alert("✅ تم الحفظ بنجاح");
                    renderAdminList();
                } else {
                    alert("❌ فشل الحفظ");
                }
            } catch (e) {
                alert("حدث خطأ في الاتصال");
            }
        }
    </script>
</body>
</html>
